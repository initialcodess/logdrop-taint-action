# Continuously verifies that the published action actually works.
#
# This is the repository customers point `uses:` at. If something breaks (the
# download URL, sha256, version match, licence flow) we need to see it BEFORE they do.
#
# It does not run on pull requests from forks: forks get no secrets, and without a
# licence the scan exits 2, leaving a contributor with a meaningless red check.
name: Smoke test

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"     # every Monday 06:00 UTC — catches silent breakage
  workflow_dispatch:

jobs:
  smoke:
    name: Run the action over sample code
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate sample Swift source
        run: |
          mkdir -p sample
          cat > sample/Vulnerable.swift <<'SWIFT'
          // A known flow: user input reaches the WebView unsanitised.
          func render() {
              let name = nameField.text ?? ""
              webView.loadHTMLString("<h1>\(name)</h1>", baseURL: nil)
          }
          // The sanitised form must produce NO finding.
          func safe() {
              let name = nameField.text ?? ""
              webView.loadHTMLString(escapeHTML(name), baseURL: nil)
          }
          SWIFT

      - name: LogDrop Taint
        id: taint
        continue-on-error: true      # findings are expected
        uses: ./
        with:
          license: ${{ secrets.LOGDROP_LICENSE }}
          path: sample
          fail-on-findings: "true"
          upload-sarif: "false"

      - name: Verify the result
        env:
          FINDINGS: ${{ steps.taint.outputs.findings }}
          OUTCOME: ${{ steps.taint.outcome }}
        run: |
          set -euo pipefail

          # continue-on-error exists to tolerate the findings exit (1) — but it swallows
          # EVERY failure. A 404 on the download also leaves the count empty, and the
          # message "expected 1 finding" pointed at the wrong place. So separate the
          # download first: no binary means the problem is distribution, not the scan.
          if ! find "$RUNNER_TEMP/logdrop-taint" -name logdrop-taint -type f 2>/dev/null | grep -q .; then
            echo "::error title=Analyzer download failed::The binary could not be fetched. The likeliest cause: the analyzer-version pin in action.yml points at a version that has NOT been published yet (during a release the pin is updated before the tag — this test breaks in that window and recovers once the release is out)."
            exit 1
          fi

          # Exactly ONE finding: the vulnerable function must be caught and the
          # sanitised one must not. "At least one" would hide the sanitiser breaking —
          # a false positive is the most expensive mistake this product can make.
          if [ "${FINDINGS:-0}" -ne 1 ]; then
            echo "::error::expected 1 finding, got: '${FINDINGS:-}' (step outcome: $OUTCOME)"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::the step should have failed with fail-on-findings on (outcome: $OUTCOME)"
            exit 1
          fi
          test -f logdrop-taint.sarif || { echo "::error::no SARIF was written"; exit 1; }
          echo "Smoke test passed: 1 finding, the sanitised flow stayed quiet, the CI gate fired."

      - name: Verify it refuses to run without a licence
        run: |
          set -euo pipefail
          # The licence gate is the product's commercial foundation; if it opens silently, nobody notices.
          bin="$(find "$RUNNER_TEMP/logdrop-taint" -name logdrop-taint -type f | head -1)"
          test -n "$bin" || { echo "::error::the downloaded binary was not found"; exit 1; }
          set +e; env -u LOGDROP_LICENSE "$bin" sample --sarif /dev/null >/dev/null 2>&1; code=$?; set -e
          [ "$code" -eq 2 ] || { echo "::error::it ran without a licence (code $code)"; exit 1; }
          echo "Licence gate verified: exit 2 without a key."

name: "LogDrop Taint"
description: "Taint (data-flow) analysis for iOS/Swift source code. Your source never leaves the runner; only SARIF is produced."
author: "Initial Code Software Solutions"

branding:
  icon: shield
  color: blue

inputs:
  license:
    description: "Your LogDrop licence key. Keep it in a repository secret and pass it here. It is verified offline; no data is sent anywhere."
    required: true
  path:
    description: "The .swift file or directory to scan, relative to the repository root."
    required: false
    default: "."
  repo-root:
    description: "The root that SARIF paths are relative to. Code Scanning can bind a finding to a file only through a repo-root path."
    required: false
    default: ${{ github.workspace }}
  sarif-file:
    description: "Path of the SARIF file to write."
    required: false
    default: "logdrop-taint.sarif"
  fail-on-findings:
    description: "Fail the step when there are findings. Use it as a CI gate."
    required: false
    default: "false"
  annotations:
    description: "Show findings as a box above the line in the pull request. Free; no Code Scanning licence needed."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload the SARIF to Code Scanning. If Code Scanning is off on your repository the step warns and moves on rather than breaking the build."
    required: false
    default: "true"
  panel-url:
    description: "The panel address, if reports should be sent to the LogDrop panel. LEFT EMPTY, nothing is sent (the default). The only thing sent is the SARIF, never your source."
    required: false
    default: ""
  bundle-id:
    description: "The application id (e.g. com.company.app). Required when panel-url is set — the panel merges binary and source reports into one app under it."
    required: false
    default: ""
  snippets:
    description: "Include the offending line and ±2 lines of context in the report (on by default). Set to 'false' and the report carries only the rule and file:line — not a fragment of your code leaves."
    required: false
    default: "true"
  analyzer-version:
    description: "Which analyzer version to download. The default is the one tested with this action release — you should not need to change it."
    required: false
    default: "v1.13.0"

outputs:
  sarif-file:
    description: "Path of the SARIF file that was written."
    value: ${{ inputs.sarif-file }}
  findings:
    description: "How many findings were reported."
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    # The analyzer arrives prebuilt: nothing is compiled on the customer's machine
    # (~4 minutes saved) and no access to the source is required.
    - name: Download the analyzer
      id: fetch
      shell: bash
      env:
        VERSION: ${{ inputs.analyzer-version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid analyzer-version: '$VERSION' (expected format: v1.2.3)"
          exit 1
        fi

        dir="$RUNNER_TEMP/logdrop-taint/$VERSION"
        mkdir -p "$dir"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

        # Do not download again if the action is used more than once in a workflow.
        if [ -x "$dir/logdrop-taint" ]; then
          echo "Reusing the cached copy: $VERSION"
          exit 0
        fi

        archive="logdrop-taint-${VERSION}-macos-universal.tar.gz"
        base="https://github.com/initialcodess/logdrop-taint-action/releases/download/${VERSION}"

        curl -fsSL --retry 3 --retry-delay 2 -o "$dir/$archive" "$base/$archive"
        curl -fsSL --retry 3 --retry-delay 2 -o "$dir/$archive.sha256" "$base/$archive.sha256"

        # Integrity: the downloaded archive must be byte-identical to the published one.
        ( cd "$dir" && shasum -a 256 -c "$archive.sha256" )

        tar -xzf "$dir/$archive" -C "$dir"
        chmod +x "$dir/logdrop-taint"
        "$dir/logdrop-taint" --version

    - name: Run the scan
      id: scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # The key goes in the environment, not on the command line: command lines can
        # show up in run logs and in the process list.
        LOGDROP_LICENSE: ${{ inputs.license }}
        BIN_DIR: ${{ steps.fetch.outputs.dir }}
        SCAN_PATH: ${{ inputs.path }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        REPO_ROOT: ${{ inputs.repo-root }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        ANNOTATIONS: ${{ inputs.annotations }}
        SNIPPETS: ${{ inputs.snippets }}
      run: |
        set -o pipefail
        args=("$SCAN_PATH" --sarif "$SARIF_FILE" --repo-root "$REPO_ROOT" --verbose)
        [ "$FAIL_ON_FINDINGS" = "true" ] && args+=(--fail-on-findings)
        [ "$ANNOTATIONS" = "true" ] && args+=(--github-annotations)
        [ "$SNIPPETS" = "false" ] && args+=(--no-snippets)

        # PRESERVE the exit code: 0 clean · 1 findings · 2 licence. Each means something different.
        set +e
        "$BIN_DIR/logdrop-taint" "${args[@]}" | tee scan-output.txt
        status=${PIPESTATUS[0]}
        set -e

        findings=$(sed -n 's/^LogDrop Taint: \([0-9]*\) finding.*/\1/p' scan-output.txt | head -1)
        findings=${findings:-0}
        echo "findings=$findings" >> "$GITHUB_OUTPUT"

        {
          echo "## LogDrop Taint"
          echo ""
          if [ "$findings" -eq 0 ]; then
            echo "No findings."
          else
            echo "**$findings finding(s).**"
            echo ""
            echo "| Location | Rule | Finding |"
            echo "|---|---|---|"
            sed -n 's/^  \[\([^]]*\)\] \([^ ]*\) — \(.*\)$/| `\2` | \1 | \3 |/p' scan-output.txt
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # The flag is written BEFORE exiting so it survives a --fail-on-findings exit.
        if [ -f "$SARIF_FILE" ]; then
          echo "sarif-written=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-written=false" >> "$GITHUB_OUTPUT"
        fi
        rm -f scan-output.txt
        exit $status

    # Code Scanning is free on public repositories and depends on a paid licence on
    # private ones. On a customer without one the upload step errors and would break
    # the build even though the scan SUCCEEDED. So we probe and pass with a warning:
    # finding reporting (inline boxes + job summary + exit code) is unaffected.
    - name: Is Code Scanning available
      id: codescanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-written == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        code=$(curl -sS -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=1" || echo 000)
        case "$code" in
          403|404)
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SARIF not uploaded::Code Scanning is unavailable on this repository (HTTP $code). On private repositories it needs a paid Code Security licence, and your workflow needs the 'security-events: write' permission. The scan ran — the findings appear in the inline annotations and the job summary."
            ;;
          *) echo "available=true" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Upload the SARIF to Code Scanning
      if: ${{ always() && steps.codescanning.outputs.available == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: logdrop-taint

    # Reporting to the LogDrop panel — OPTIONAL, OFF by default.
    #
    # Privacy: the only thing sent is the SARIF (rule + file + line). The source text
    # neither enters the SARIF nor gets sent. File PATHS do leave the machine, though,
    # so the decision belongs to the customer and the default is off.
    #
    # The network call lives here, NOT in the analyzer: the binary contacts no server,
    # which is how the promise "the program tells nobody it ran" is kept.
    #
    # always(): with fail-on-findings the scan step exits 1. That is exactly when the
    # report matters — when there are findings.
    - name: Notify the panel
      if: ${{ always() && inputs.panel-url != '' && steps.scan.outputs.sarif-written == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PANEL_URL: ${{ inputs.panel-url }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        LICENSE: ${{ inputs.license }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        APP_NAME: ${{ github.event.repository.name }}
        COMMIT: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -uo pipefail
        if [ -z "$BUNDLE_ID" ]; then
          echo "::error title=bundle-id missing::panel-url was given but bundle-id was not. The panel uses bundle-id to decide which application a report belongs to."
          exit 1
        fi

        url="${PANEL_URL%/}/api/reports/sarif"
        body="$RUNNER_TEMP/panel-response.txt"

        # NO `|| echo 000`: when curl cannot connect, -w already prints "000"; combining
        # the two yields "000000" and the "panel unreachable" branch never matches.
        code=$(curl -sS -o "$body" -w '%{http_code}' -X POST "$url" \
          -H "Authorization: Bearer $LICENSE" \
          -F "sarif=@$SARIF_FILE" \
          -F "bundle_id=$BUNDLE_ID" \
          -F "app_name=$APP_NAME" \
          -F "version=$REF_NAME" \
          -F "commit=$COMMIT")
        code=${code:-000}

        # Sending to the panel does NOT break the build. The scan succeeded and finding
        # reporting (inline annotations + job summary + exit code) already ran; a
        # customer's pull request turning red while the panel is under maintenance would
        # be a fault charged to us. Nor do we pass silently — a warning is emitted.
        case "$code" in
          200|201)
            echo "Sent to the panel: $(head -c 300 "$body")"
            ;;
          401)
            echo "::warning title=Panel report not sent::The panel refused the licence key (401). Check the key."
            ;;
          403)
            # A 403 can carry two causes: expired OR revoked. Saying "renew it" would be
            # misleading for a revocation, so we show the panel's own explanation and
            # point the customer at sales.
            echo "::warning title=Panel report not sent::The panel refused the licence (403): $(head -c 300 "$body") — it may be expired or revoked. satis@initialcode.io"
            ;;
          400|422)
            echo "::warning title=Panel report not sent::The panel rejected the request ($code). Check bundle-id and the SARIF file: $(head -c 300 "$body")"
            ;;
          413)
            echo "::warning title=Panel report not sent::The SARIF exceeded the panel size limit (413). Try narrowing the scan: use exclude in .logdrop.json to drop Pods/ and generated code."
            ;;
          503)
            echo "::warning title=Panel report not sent::The panel is currently unavailable (503). The scan was unaffected; the next run will try again."
            ;;
          000)
            echo "::warning title=Panel report not sent::The panel could not be reached ($PANEL_URL). The scan was unaffected."
            ;;
          *)
            echo "::warning title=Panel report not sent::The panel returned $code: $(head -c 300 "$body")"
            ;;
        esac
        rm -f "$body"
